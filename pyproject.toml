[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpilot"
version = "0.1.0"
description = "A self-correcting AI agent that completes multi-step web workflows, verifies every action, and recovers from failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["google-genai>=1.0", "anthropic>=0.40", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
webpilot = "webpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
